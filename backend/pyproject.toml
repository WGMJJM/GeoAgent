[project]
name = "geoagent"
version = "0.1.0"
description = "A GIS-oriented intelligent assistant agent with reliable spatial execution."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "geopandas>=0.14,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "openai>=1.40,<3",
    "tokenizers==0.23.2",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
